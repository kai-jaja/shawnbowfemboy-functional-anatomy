<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>功能解剖（一）圖片測驗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E8EBEE; --surface:#FFFFFF; --sunk:#F3F5F7; --ink:#1D2633; --muted:#5B6675; --line:#CDD3DA;
  --navy:#2C4573; --red:#B3121B; --bronze:#85694A; --ok:#2E7A4C; --okbg:#E3F2E8; --bad:#B3121B; --badbg:#FBE5E6;
  --tag:#FFFDF6; --tagline:#2C4573;
  --sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#12161C;--surface:#1A2028;--sunk:#222A34;--ink:#E5E9EF;--muted:#9AA5B4;--line:#323C48;
  --navy:#93ADE0;--red:#FF7A7F;--bronze:#C9A77F;--ok:#74C996;--okbg:#1C3326;--bad:#FF7A7F;--badbg:#3A1E22;--tag:#FFFDF6;--tagline:#2C4573;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#12161C;--surface:#1A2028;--sunk:#222A34;--ink:#E5E9EF;--muted:#9AA5B4;--line:#323C48;
  --navy:#93ADE0;--red:#FF7A7F;--bronze:#C9A77F;--ok:#74C996;--okbg:#1C3326;--bad:#FF7A7F;--badbg:#3A1E22;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;border-bottom:3px solid var(--navy);padding-bottom:14px;margin-bottom:18px;position:relative}
header::after{content:"";position:absolute;left:0;bottom:-3px;height:3px;width:100%;background:linear-gradient(90deg,var(--bronze) 0 34%,var(--navy) 34% 67%,var(--red) 67% 100%)}
h1{font-family:var(--serif);font-weight:700;font-size:clamp(24px,3.2vw,34px);line-height:1.2;margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
.modes{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px}
.modes button{border:0;background:none;padding:8px 16px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--navy);color:var(--surface)}
.figs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.figs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.figs button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);font-weight:700}
.figs .pg{color:var(--muted);font-weight:400;margin-left:6px;font-size:12px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:1fr}}
.stagewrap{min-width:0}
.tools{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin:0 0 8px;font-size:13px;color:var(--muted)}
.zoom{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.zoom button{border:0;background:none;padding:4px 10px;cursor:pointer;font-size:13px}
.zoom button[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.stage{background:#fff;border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;max-height:calc(100vh - 140px)}
.saved{margin-left:auto}
.linkbtn{border:0;background:none;padding:0;color:var(--navy);text-decoration:underline;cursor:pointer;font-size:12px}
.plate{position:relative;width:calc(var(--z,1)*100%);min-width:calc(var(--z,1)*560px);container-type:inline-size;user-select:none}
.plate img{display:block;width:100%;height:auto}
.hide{position:absolute}
.mask{position:absolute;border:1.5px solid var(--tagline);background:var(--tag);border-radius:3px;cursor:pointer;padding:0;display:flex;align-items:center;
  font-size:9px;font-size:clamp(8px,1.05cqw,14px);line-height:1.1;color:#1D2633;text-align:left;overflow:visible}
.mask .n{flex:none;display:grid;place-items:center;min-width:1.7em;height:1.7em;margin-left:.25em;border-radius:50%;background:#B3121B;color:#fff;font-weight:700;font-size:.92em}
.mask .t{padding:0 .35em;font-family:var(--serif);font-weight:600;white-space:normal}
.mask.cur{box-shadow:0 0 0 3px #F2B705,0 0 0 6px rgba(242,183,5,.35);z-index:3}
.mask.ok{background:#E3F2E8;border-color:#2E7A4C}.mask.ref{background:#F4F1EA;border-color:#9C968A;border-style:dashed}.mask.ref .t{color:#4A4741}.mask.ok .n{background:#2E7A4C}
.mask.bad{background:#FBE5E6;border-color:#B3121B}
.mask{width:var(--w);height:var(--h)}
.mask.ok,.mask.bad{width:var(--w);height:var(--h);min-width:0;overflow:hidden}
.mask.ok .t,.mask.bad .t{font-size:.82em;line-height:1.05;padding:0 .25em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.mask.ok .n,.mask.bad .n{min-width:1.35em;height:1.35em;font-size:.75em;margin-left:.15em}
.spot{position:absolute;transform:translate(-50%,-50%);width:clamp(18px,2.6cqw,30px);height:clamp(18px,2.6cqw,30px);border-radius:50%;border:2px solid #fff;
  background:#2C4573;color:#fff;font-weight:700;font-size:clamp(10px,1.4cqw,15px);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.45);z-index:2}
.spot:hover{background:#B3121B}
.plate.picking .spot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,183,5,.55)}}
@media (prefers-reduced-motion:reduce){.plate.picking .spot{animation:none;outline:2px solid #F2B705}}
svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px;position:sticky;top:calc(12px + env(safe-area-inset-top,0px))}
@media (max-width:980px){.panel{position:static}}
.qno{display:flex;align-items:baseline;gap:10px;margin:0 0 4px}
.qno b{font-family:var(--serif);font-size:44px;line-height:1;color:var(--red)}
.qno span{color:var(--muted);font-size:14px}
.prompt{margin:0 0 14px;font-size:15px}
.opts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.opt{width:100%;display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:10px 12px;cursor:pointer;font-family:var(--serif);font-weight:600;font-size:15px}
.opt kbd{font-family:var(--sans);font-weight:500;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:4px;min-width:22px;text-align:center;background:var(--surface)}
.opt:hover:not([disabled]){border-color:var(--navy)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.fb{min-height:1.6em;margin:12px 0 0;font-size:14px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.btn{border:1px solid var(--navy);background:var(--navy);color:var(--surface);border-radius:6px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn.ghost{background:none;color:var(--navy)}
.btn[disabled]{opacity:.45;cursor:default}
.stats{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:14px;color:var(--muted)}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:6px;display:flex}
.bar i{display:block;height:100%}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}

.board{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.75fr) minmax(0,1fr);column-gap:clamp(28px,5vw,64px);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px}
.col{display:flex;flex-direction:column;gap:10px;position:relative;z-index:2}
.col h3{margin:0 0 2px;font-size:13px;font-weight:500;color:var(--muted)}
.card{overflow-wrap:break-word;hyphens:auto;border:1.5px solid var(--line);background:var(--sunk);border-radius:6px;padding:9px 11px;text-align:left;cursor:pointer;font-size:14px;line-height:1.45;flex:1;display:flex;align-items:center;gap:8px}
.card:hover:not([disabled]){border-color:var(--navy)}
.card.sel{border-color:#F2B705;box-shadow:0 0 0 3px rgba(242,183,5,.35)}
.card.mus{font-family:var(--serif);font-weight:600;background:var(--surface);flex-direction:column;align-items:flex-start;justify-content:center;gap:0}
.card.mus small{font-family:var(--sans);font-weight:400;color:var(--muted);font-size:12px}
.card.mus .chip{display:inline-block;width:14px;height:4px;border-radius:2px;margin-bottom:4px}
.card.mus.view{outline:2px solid var(--navy);outline-offset:1px}
.card[disabled]{cursor:default}
svg.links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
@media (max-width:640px){.board{padding:10px;column-gap:22px}.card{font-size:12.5px;padding:7px 8px}}
.mfig{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px;margin:0 0 8px}
.mfig img{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
.mcap{font-size:13px;color:var(--muted);margin:0 0 12px}
.mcap b{font-family:var(--serif);color:var(--ink);font-size:16px;margin-right:6px}
.res{font-size:13px;margin:4px 0;line-height:1.5}
.res .ok{color:var(--ok)}.res .bad{color:var(--bad)}
table.oi{width:100%;border-collapse:collapse;font-size:14px}
table.oi th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:0 4px 6px}
table.oi td{padding:6px 4px;border-top:1px solid var(--line);vertical-align:top}
.mname{font-family:var(--serif);font-weight:600;line-height:1.25}
.mname small{display:block;font-family:var(--sans);font-weight:400;color:var(--muted);font-size:12px}
.slot{width:44px;height:36px;border:1.5px dashed var(--line);background:var(--sunk);border-radius:6px;cursor:pointer;font-weight:700;font-size:16px}
.slot.on{border-style:solid;border-color:#F2B705;box-shadow:0 0 0 3px rgba(242,183,5,.35)}
.slot.ok{border:1.5px solid var(--ok);background:var(--okbg);color:var(--ok)}
.slot.bad{border:1.5px solid var(--bad);background:var(--badbg);color:var(--bad)}
.ans{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.ans b{color:var(--ink);font-weight:500}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:0}
.foot{margin-top:28px;font-size:12px;color:var(--muted)}

.subtabs{display:flex;gap:4px;margin:0 0 14px;border-bottom:1px solid var(--line)}
.subtabs button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px}
.subtabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red);font-weight:700}
.typeform{display:flex;gap:8px}
.typeform input{flex:1;min-width:0;font:inherit;font-family:var(--serif);font-size:17px;padding:8px 10px;border:1.5px solid var(--line);border-radius:6px;background:var(--sunk);color:var(--ink)}
.typeform input:focus{outline:none;border-color:var(--navy)}
.findname{font-family:var(--serif);font-weight:700;font-size:24px;line-height:1.25;margin:0 0 6px;color:var(--navy)}
.board.two{grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr)}
.figs{flex-direction:column;align-items:stretch}
.grp{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.gl{font-size:12px;color:var(--muted);min-width:4.5em}
.pct{font-size:11px;color:var(--ok);margin-left:6px;font-weight:500}
.examintro{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:70ch}
.examintro h2{font-family:var(--serif);font-size:30px;margin:0 0 8px}
.resfix{margin:0 0 8px 20px;font-size:13px;line-height:1.55}.resfix .lbl{display:inline-block;min-width:3em;font-weight:600;color:var(--ink)}.resfix .yo{color:var(--muted);text-decoration:line-through}.resfix .ans{color:var(--ok);font-weight:600}.resfix br+*{}
.gtag,.qno span.gtag{display:inline-block;margin-left:8px;padding:0 7px;border-radius:4px;background:var(--bronze);color:var(--surface);font-size:12px;line-height:20px;vertical-align:middle;font-weight:600}
.exh{font-size:15px;margin:18px 0 0}.exr{margin-top:8px}
.tg{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 13px;cursor:pointer;font:inherit;font-size:14px}
.tg[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.sm{padding:5px 11px;font-size:13px}.btn.ghost[aria-pressed="true"]{background:var(--navy);color:var(--surface)}
.examq .mfig img{max-height:520px}
.opt.chosen{border-color:var(--navy);box-shadow:inset 0 0 0 1.5px var(--navy);background:var(--surface)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:16px}
.dot{width:28px;height:28px;border-radius:5px;border:1px solid var(--line);background:var(--sunk);font-size:11px;cursor:pointer;padding:0;color:var(--muted)}
.dot.on{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.dot.cur{outline:2px solid #F2B705;outline-offset:1px}
.modes button{white-space:nowrap}
.tools[hidden]{display:none}
.cats{display:flex;flex-wrap:wrap;gap:8px}
.cat{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;display:inline-flex;align-items:center}
.cat.has{border-color:var(--navy)}
.cat[aria-expanded="true"]{background:var(--navy);color:var(--surface);border-color:var(--navy)}
.cat[aria-expanded="true"] .pg,.cat[aria-expanded="true"] .pct{color:inherit;opacity:.85}
.caret{margin-left:8px;transition:transform .15s}
.cat[aria-expanded="true"] .caret{transform:rotate(180deg)}
@media (prefers-reduced-motion:reduce){.caret{transition:none}}
.subs{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0 2px 12px;border-left:3px solid var(--navy);margin-left:4px}
.subs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:14px}
.subs button[aria-pressed="true"]{border-color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy);font-weight:700}
.settitle{font-size:13px;color:var(--muted);margin:0 0 8px}
details.stats summary{cursor:pointer}
.grip{display:none;align-items:center;justify-content:center;gap:10px;width:100%;border:0;padding:4px 0 8px;font-size:12px;color:var(--muted);cursor:pointer;background:var(--surface);position:sticky;top:-6px;z-index:2}
.grip em{font-style:normal}
.grip span{width:36px;height:4px;border-radius:2px;background:var(--line)}
.sidesw{display:flex;gap:4px;margin:0 0 10px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px}
.sidesw button{flex:1;border:0;background:none;padding:8px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.sidesw button[aria-selected="true"]{background:var(--navy);color:var(--surface)}
@media (max-width:979px){
  .figs .grp,.cats,.subs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
  .figs .grp::-webkit-scrollbar,.cats::-webkit-scrollbar,.subs::-webkit-scrollbar{display:none}
  .figs .grp>*,.cats>*,.subs>*{flex:none}
  .figs{min-width:0}.figs>*{min-width:0;max-width:100%}
  #panel{display:flex;flex-direction:column}
  #panel>.subtabs{order:-2}#panel>.navrow{order:-1;margin:0 0 8px}
  .qno{margin-top:2px}
  .plate{min-width:0}
  .stage{max-height:none}
  .grid{gap:12px}
  body:not([data-tab="exam"]) .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;max-height:56vh;overflow:auto;overscroll-behavior:contain;border-radius:14px 14px 0 0;border-bottom:0;padding:6px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 24px rgba(0,0,0,.18)}
  body:not([data-tab="exam"]) .grip{display:flex}
  .panel.min #panel{display:none}
  .qno b{font-size:32px}
  .opt{padding:9px 10px}
  .subtabs{margin-bottom:10px}
  .mfig img{max-height:30vh}
}
@media (max-width:700px){.opts{grid-template-columns:1fr 1fr}.opt{font-size:14px;padding:8px}
  header{padding-bottom:10px;margin-bottom:12px}h1{font-size:21px}.sub{display:none}.modes button{padding:6px 10px;font-size:14px}
  .saved{display:none}.tools{margin-bottom:6px}body:not([data-tab="exam"]) .panel{max-height:50vh}.mfig img{max-height:20vh}.figs{margin-bottom:10px}
  body[data-tab="oi"] #panel .hint{display:none}body[data-tab="oi"] .mfig img{max-height:15vh}body[data-tab="oi"] .mcap{margin-bottom:8px}}
@media (hover:none){.kbdhint,.opt kbd{display:none}button,.mask{touch-action:manipulation}}
@media (pointer:coarse){.mask::after{content:"";position:absolute;inset:-5px -4px}}
body[data-tab="exam"] .grid{grid-template-columns:1fr;max-width:880px;margin:0 auto}
body[data-tab="exam"] .panel{position:static}
body[data-tab="exam"] #stage:empty,body[data-tab="exam"] .stagewrap:has(#stage:empty){display:none}
.panel .stage,.panel .examq{margin:4px 0 14px}
.panel .examq .mfig img{max-height:420px}
.mask.static{cursor:default}

@media (max-width:979px){
  body:not([data-tab="exam"]) .panel{position:static;max-height:none;overflow:visible;border-radius:6px;border-bottom:1px solid var(--line);box-shadow:none;padding:14px}
  .grip{display:none!important}
  body[data-tab="label"] .stagewrap{position:sticky;top:0;z-index:15;background:var(--bg);margin:0 -12px;padding:calc(4px + env(safe-area-inset-top,0px)) 12px 6px}
  body[data-tab="label"] .stage{max-height:46vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  body[data-tab="label"] .tools{margin-bottom:4px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1>功能解剖（一）圖片測驗</h1>
    <p class="sub">Functional Anatomy (I): Upper body　Fu-Lien Wu, PT, PhD　講義圖片出題</p>
  </div>
  <div class="modes" role="tablist" aria-label="測驗模式">
    <button role="tab" data-tab="label">標籤挖空</button>
    <button role="tab" data-tab="oi">肌肉連連看</button>
    <button role="tab" data-tab="exam">模擬考</button>
  </div>
</header>
<nav class="figs" id="figs" aria-label="選擇題組"></nav>
<div class="grid">
  <div class="stagewrap"><div class="tools" id="tools"><span>放大</span><div class="zoom" id="zoom"><button data-z="1">100%</button><button data-z="1.5">150%</button><button data-z="2">200%</button></div><span class="saved" id="saved"></span></div>
  <div id="stage"></div></div>
  <aside class="panel" id="sheet"><button class="grip" id="grip" type="button" aria-expanded="true" aria-controls="panel"><span aria-hidden="true"></span><em>收合題目</em></button><div id="panel" aria-live="polite"></div></aside>
</div>

  Object.keys(DATA.figs).forEach(k=>{const f=DATA.figs[k];if(rg.includes(f.region))f.masks.forEach((_,j)=>lab.push({k,j}))});
  DATA.oi.filter(s=>rg.includes(s.region)).forEach(s=>s.modes.forEach(md=>s.muscles.forEach((m,mi)=>{if(!inMode(m,md))return;
    if(md==='oi'){pool.push({s:s.id,mi,k:'o'});pool.push({s:s.id,mi,k:'i'})}else pool.push({s:s.id,mi,k:md})})));
  return {lab,pool}}
function buildExam(n){
  const qs=[],rg=exRange(),{lab,pool}=examPools(rg);
  let nl=Math.min(Math.round(n*0.55),lab.length);const nm=Math.min(n-nl,pool.length);nl=Math.min(lab.length,n-nm);
  weighted(lab,c=>wOf(c.k,c.j)).slice(0,nl).forEach(({k,j:i})=>{const f=DATA.figs[k];
    const type=Math.random()<0.6?'lc':'lt';qs.push({type,fig:k,i,opts:type==='lc'?buildOptions(f,f.masks[i].a):null})});
  shuffle(pool).slice(0,nm).forEach(p=>{const s=DATA.oi.find(x=>x.id===p.s),m=s.muscles[p.mi];
    const arr=p.k==='o'?s.origins:p.k==='i'?s.insertions:p.k==='act'?s.actions:s.nerves,ans=arr[answerOf(m,p.k)];
    let others=[...new Set(arr.filter(x=>x!==ans))];
    if(others.length<4){const ext=DATA.oi.filter(x=>x.region===s.region&&x.id!==s.id).flatMap(x=>p.k==='o'?x.origins:p.k==='i'?x.insertions:p.k==='act'?x.actions:x.nerves);
      shuffle([...new Set(ext)]).forEach(x=>{if(others.length<4&&x!==ans&&!others.includes(x))others.push(x)})}
    qs.push({type:'m',s:p.s,mi:p.mi,k:p.k,opts:shuffle([ans,...shuffle(others).slice(0,4)]),ans})});
  STORE.exam={qs:shuffle(qs),pos:0,ans:{},res:{},start:Date.now(),n:qs.length,range:rg};
}
function qRegion(q){return q.type==='m'?DATA.oi.find(x=>x.id===q.s).region:DATA.figs[q.fig].region}
function renderExam(){
  const E=STORE.exam;
  if(!E){const rg=exRange(),{lab,pool}=examPools(rg),max=lab.length+pool.length,same=a=>a.length===rg.length&&a.every(x=>rg.includes(x));
    const ns=[20,30,40].filter(n=>n<=max);if(!ns.length)ns.push(max);
    $('#stage').innerHTML=`<div class="examintro"><h2>模擬考</h2><p>從選定範圍的圖片標籤，加上肌肉的起點、止點、動作和神經，隨機抽題混合出題。常錯的標籤比較容易被抽到。考完會依區域分別計分。</p>
    <h3 class="exh">考試範圍</h3>
    <div class="row exr">${[['all','全部'],['upper','頭頸與上肢'],['trunk','軀幹'],['lower','下肢']].map(([k,l])=>`<button class="btn ghost sm" data-expre="${k}" aria-pressed="${same(RGROUPS[k])}">${l}</button>`).join('')}</div>
    <div class="row exr">${REGIONS.map(r=>`<button class="tg" data-exr="${r}" aria-pressed="${rg.includes(r)}">${r}</button>`).join('')}</div>
    <p class="hint">這個範圍可抽 ${lab.length} 個標籤、${pool.length} 題肌肉題。點區域可以加選或取消，至少要留一個。</p>
    <div class="row">${ns.map(n=>`<button class="btn" data-exam="${n}">開始 ${n} 題</button>`).join('')}</div></div>`;
    $('#panel').innerHTML=`<p class="hint" style="margin-top:0">考試中不會顯示對錯，交卷後才會看到結果。考到一半關掉網頁，下次會接著考。</p>`;return}
  const N=E.qs.length;
  if(E.done){const by={};E.qs.forEach((q,i)=>{const r=qRegion(q);by[r]=by[r]||[0,0];by[r][1]++;if(E.res[i])by[r][0]++});
    const ok=Object.values(E.res).filter(Boolean).length,mins=Math.round((E.end-E.start)/60000);
    $('#stage').innerHTML=`<div class="examintro"><h2>${Math.round(ok/N*100)} 分</h2><p>${N} 題答對 ${ok} 題，用時約 ${mins} 分鐘。<br><span class="hint">範圍：${E.range&&E.range.length<REGIONS.length?E.range.join('、'):'全部'}</span></p>
      <table class="oi"><thead><tr><th>區域</th><th>答對</th><th>正確率</th></tr></thead><tbody>${REGIONS.filter(r=>by[r]).map(r=>`<tr><td>${r}</td><td>${by[r][0]} / ${by[r][1]}</td><td>${Math.round(by[r][0]/by[r][1]*100)}%</td></tr>`).join('')}</tbody></table>
      <h3 style="margin-top:20px;font-size:15px">答錯的題目</h3>${E.qs.map((q,i)=>E.res[i]?'':`<p class="res">第 ${i+1} 題　${esc(qText(q))}<br><span class="bad">你的答案：${esc(E.ans[i]||'（未作答）')}</span>　<span class="ok">正確：${esc(qAns(q))}</span></p>`).join('')||'<p class="hint">全部答對。</p>'}
      <div class="row"><button class="btn" id="examnew">再考一次</button></div></div>`;
    $('#panel').innerHTML=`<p class="hint" style="margin-top:0">標籤題的作答也會計入各圖的錯題本。</p>`;return}
  const q=E.qs[E.pos],a=E.ans[E.pos];
  let left='',o=`<p class="qno"><b>${E.pos+1}</b><span>/ ${N} 題　已作答 ${Object.keys(E.ans).length}</span></p>`;
  if(q.type==='m'){const s=DATA.oi.find(x=>x.id===q.s),m=s.muscles[q.mi];
    left=`<div class="examq"><div class="mfig"><img src="${DATA.mimg[m.img]}" alt=""></div></div>`;o+=`<p class="prompt">${esc(qText(q))}</p>`}
  else{const f=DATA.figs[q.fig];left=`<div class="stage"><div class="plate" id="plate">${plateHTML(f,{mode:'exam',target:q.i})}</div></div>`;o+=`<p class="prompt">${q.type==='lc'?'圖中標示「?」的結構是？':'請輸入圖中「?」的英文名稱：'}</p>`}
  o+=left;$('#stage').innerHTML='';
  if(q.type==='lt')o+=`<form class="typeform" id="examform" autocomplete="off"><input id="typein" type="text" spellcheck="false" autocapitalize="off" value="${esc(a||'')}" aria-label="輸入答案"><button class="btn">存下答案</button></form>`;
  else o+=`<ul class="opts">${q.opts.map((x,n)=>`<li><button class="opt ${a===x?'chosen':''}" data-ex="${esc(x)}"><kbd>${n+1}</kbd>${esc(x)}</button></li>`).join('')}</ul>`;
  o+=`<div class="row"><button class="btn ghost" id="eprev" ${E.pos?'':'disabled'}>上一題</button><button class="btn ghost" id="enext" ${E.pos<N-1?'':'disabled'}>下一題</button><button class="btn" id="esubmit">交卷</button>${quitAsk?`<span class="hint" style="margin-left:auto;align-self:center">確定退出？作答不計分，也不記入錯題本。</span><button class="btn" id="equitok">確定退出</button><button class="btn ghost" id="equitno">繼續考試</button>`:`<button class="btn ghost" id="equit" style="margin-left:auto">退出考試</button>`}</div>
  <div class="dots">${E.qs.map((_,i)=>`<button class="dot ${E.ans[i]!=null?'on':''} ${i===E.pos?'cur':''}" data-epos="${i}" aria-label="第 ${i+1} 題">${i+1}</button>`).join('')}</div>`;
  $('#panel').innerHTML=o;
}
function qText(q){if(q.type==='m'){const s=DATA.oi.find(x=>x.id===q.s),m=s.muscles[q.mi];const w={o:'起點',i:'止點',act:s.id.startsWith('face')?'功能':'動作',nerve:'神經支配'}[q.k];return `${m.en}（${m.zh}）的${w}是？`}
  return `${DATA.figs[q.fig].title}　${q.type==='lc'?'選擇':'拼字'}`}
function qAns(q){return q.type==='m'?q.ans:DATA.figs[q.fig].masks[q.i].a}
function submitExam(){const E=STORE.exam;E.qs.forEach((q,i)=>{const a=E.ans[i];
    if(q.type==='m')E.res[i]=a===q.ans;else if(q.type==='lc')E.res[i]=a===DATA.figs[q.fig].masks[q.i].a;else E.res[i]=a!=null&&judgeType(a,DATA.figs[q.fig].masks[q.i].a,DATA.figs[q.fig])==='ok';
    if(q.type!=='m')record(q.fig,q.i,E.res[i])});E.done=true;E.end=Date.now();render()}

/* ---------- shell ---------- */
function chipStat(k){const st=STORE.stats[k];if(!st||st.sig!==sig(DATA.figs[k]))return'';const v=Object.values(st.c);if(!v.length)return'';
  const n=v.reduce((a,c)=>a+c[0],0),w=v.reduce((a,c)=>a+c[1],0);return ` <span class="pct">${Math.round((n-w)/n*100)}%</span>`}
function renderNav(){const nav=$('#figs');
  if(tab==='label')nav.innerHTML=figNav();else if(false)nav.innerHTML=`<div class="grp">${Object.entries(DATA.figs).filter(([k,f])=>f.masks.length).sort((a,b)=>a[1].page-b[1].page).map(([k,f])=>`<button aria-pressed="${k===figKey}" data-f="${k}">${esc(f.title)}<span class="pg">p.${f.page}</span>${chipStat(k)}</button>`).join('')}</div>`;
  else if(tab==='oi')nav.innerHTML=ociNav();
  else if(false)nav.innerHTML=REGIONS.map(r=>`<div class="grp"><span class="gl">${r}</span>${DATA.oi.filter(s=>s.region===r).map(s=>{const sc=s.modes.map(md=>STORE.ost[s.id+'|'+md]).filter(Boolean);
      const done=sc.length?` <span class="pct">${sc.length}/${s.modes.length} 已完成</span>`:'';return `<button aria-pressed="${s.id===oiKey}" data-o="${s.id}">${esc(s.title)}<span class="pg">${MC(s)} 條</span>${done}</button>`}).join('')}</div>`).join('');
  else nav.innerHTML='';
}
function applyZoom(){const p=$('#plate');if(p)p.style.setProperty('--z',tab==='label'?zoom:1);$('#tools').hidden=tab!=='label';document.querySelectorAll('#zoom button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.z===zoom))}
function render(){
  document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
  document.body.dataset.tab=tab;
  renderNav();
  if(tab==='label')renderLabel();else if(tab==='oi')renderOI();else renderExam();
  applyZoom();persist();requestAnimationFrame(sheetPad);
}
document.addEventListener('submit',e=>{e.preventDefault();const v=$('#typein').value.trim();if(!v)return;
  if(e.target.id==='typeform')answerLabel(v);else{STORE.exam.ans[STORE.exam.pos]=v;if(STORE.exam.pos<STORE.exam.qs.length-1)STORE.exam.pos++;render()}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const d=t.dataset;
  if(d.tab){tab=d.tab;return render()}
  if(d.z){zoom=+d.z;applyZoom();persist();return}
  if(t.id==='wipe'){if(confirm('確定要清除所有作答紀錄、錯題本和模擬考嗎？')){STORE={};initStore();try{localStorage.removeItem(KEY)}catch(e){}render()}return}
  if(t.id==='grip'){const sh=$('#sheet'),min=sh.classList.toggle('min');t.setAttribute('aria-expanded',!min);t.querySelector('em').textContent=min?'展開題目':'收合題目';sheetPad();return}
  if(d.side){const st=getOI();st.side=d.side;return render()}
  if(d.fcat){openFig=openFig===d.fcat?null:d.fcat;return render()}
  if(d.cat){openCat=openCat===d.cat?null:d.cat;return render()}
  if(d.f){figKey=d.f;return render()}
  if(d.lsub){lsub=d.lsub;return render()}
  if(d.o){oiKey=d.o;if(!SET().modes.includes(omode))omode=SET().modes[0];return render()}
  if(d.omode){omode=d.omode;return render()}
  if(tab==='label'){const s=getLQ();
    if(t.classList.contains('mask')){const i=+d.i;if(lsub==='find'){if(s.res[curKey(s)]===undefined&&!s.done)answerLabel(i)}else{const p=s.order.indexOf(i);if(p>=0){s.pos=p;s.done=false;render()}}return}
    if(t.classList.contains('opt'))return answerLabel(d.x);
    if(t.id==='guessed'){const s=getLQ(),q=curKey(s),f=DATA.figs[figKey],gi=lsub==='find'?f.masks.findIndex(m=>m.a===q):q,st=stat(figKey),c=st.c[gi];if(!c||s.res[q]!==true)return;st.g=st.g||{};s.guess=s.guess||{};if(s.guess[q]){delete s.guess[q];delete st.g[gi];c[2]=Math.max(0,(c[2]||0)-1)}else{s.guess[q]=1;st.g[gi]=1;c[2]=(c[2]||0)+1}return render()}
    if(t.id==='unsure'){unsure=!unsure;t.setAttribute('aria-pressed',unsure);return}
    if(t.id==='showall'){showAll=showAll===LQKEY()?null:LQKEY();return render()}
    if(t.id==='next')return nextLabel();
    if(t.id==='prev'){s.pos=Math.max(0,s.pos-1);return render()}
    if(t.id==='restart'){initLQ();return render()}
    if(t.id==='book'){initLQ(weakList());return render()}
    if(t.id==='retry'){initLQ(s.order.filter(k=>s.res[k]===false));return render()}}
  else if(tab==='oi'){
    if(d.t)return clickOI(t);if(t.id==='oicheck')return checkOI();if(t.id==='oireset'){initOI();return render()}}
  else{const E=STORE.exam;
    if(d.exam){buildExam(+d.exam);return render()}
    if(d.expre){STORE.exRange=RGROUPS[d.expre].slice();return render()}
    if(d.exr){let r=exRange();r=r.includes(d.exr)?r.filter(x=>x!==d.exr):[...r,d.exr];if(!r.length)return;STORE.exRange=REGIONS.filter(x=>r.includes(x));return render()}
    if(t.id==='examnew'){STORE.exam=null;return render()}
    if(t.id==='equit'){quitAsk=true;return render()}
    if(t.id==='equitno'){quitAsk=false;return render()}
    if(t.id==='equitok'){quitAsk=false;STORE.exam=null;return render()}
    if(d.ex!=null){E.ans[E.pos]=d.ex;if(E.pos<E.qs.length-1)E.pos++;return render()}
    if(d.epos){E.pos=+d.epos;return render()}
    if(t.id==='eprev'){E.pos--;return render()}if(t.id==='enext'){E.pos++;return render()}
    if(t.id==='esubmit'){const un=E.qs.length-Object.keys(E.ans).length;if(!un||confirm(`還有 ${un} 題沒作答，確定交卷？`))submitExam()}}
});
document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea'))return;
  const opts=[...document.querySelectorAll('.opt')];
  if(/^[1-5]$/.test(e.key)&&opts[e.key-1]&&!opts[e.key-1].disabled){opts[e.key-1].click()}
  else if(e.key==='Enter'&&tab==='label'&&document.activeElement===document.body){nextLabel()}
  else if((e.key==='g'||e.key==='G')&&tab==='label'&&!e.metaKey&&!e.ctrlKey){const b=document.getElementById('unsure')||document.getElementById('guessed');if(b)b.click()}});
new ResizeObserver(()=>{if(tab==='oi')drawLinks()}).observe(document.body);
new ResizeObserver(sheetPad).observe(document.getElementById('sheet'));
['(max-width:979px)','(max-width:700px)'].forEach(q=>matchMedia(q).addEventListener('change',()=>render()));
render();
</script>
</body>
